title: Revo Place
author: Nate Revo
description: >-
  Technology adventures with OpenShift, Kubernetes, Linux, Windows containers
  and the home lab. Formerly revo.place and therevoman.blogspot.com.
url: "https://nr3v0.github.io"
baseurl: ""
timezone: America/Los_Angeles
github_username: nr3v0

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# New posts get Blogger-style URLs, matching the migrated ones.
permalink: /:year/:month/:title.html

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - bin
  - ocp
  - .zsh_history
