<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  {%- feed_meta -%}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ '/' | relative_url }}" title="{{ site.title | escape }}">
      <img src="{{ '/assets/images/site/header.png' | relative_url }}" alt="{{ site.title | escape }}: Latest technology content" width="1080" height="250">
    </a>
  </header>

  <div class="site-content">
    <main class="main-column">
      {{ content }}
    </main>
    <aside class="sidebar">
      {%- include sidebar.html -%}
    </aside>
  </div>

  <footer class="site-footer">
    &copy; {{ site.time | date: "%Y" }} {{ site.author }} &middot;
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a> &middot;
    <a href="https://github.com/{{ site.github_username }}">GitHub</a>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
  <script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
</body>
</html>
