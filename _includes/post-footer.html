<div class="post-footer">
  Posted by {{ site.author }} at
  <a href="{{ include.post.url | relative_url }}">{{ include.post.date | date: "%B %-d, %Y" }}</a>
  {%- if include.post.tags.size > 0 %}
  <br>Labels:
  {% for tag in include.post.tags -%}
    <a href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>{% unless forloop.last %}, {% endunless %}
  {%- endfor -%}
  {%- endif %}
</div>
